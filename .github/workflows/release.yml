name: Release

on:
  release:
    types: [published]

jobs:
  gem:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
          rubygems: latest

      - uses: rubygems/release-gem@v1.4.0

  docker:
    runs-on: ubuntu-latest
    needs: gem

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            RIVULET_VERSION=${{ steps.version.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/rivulet:latest
            ${{ vars.DOCKERHUB_USERNAME }}/rivulet:${{ steps.version.outputs.tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/rivulet:${{ steps.version.outputs.tag }}-${{ github.sha }}
